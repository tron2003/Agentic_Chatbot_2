# Model and pipeline configuration.
# Secrets never go in this file: reference them with ${ENV_VAR} and put the value
# in .env (see .env.example). ${VAR:-default} supplies a fallback.

llm:
  # claude | openai | openrouter | ollama | local | demo
  # "demo" needs no API key: a scripted model for trying the UI offline.
  active_provider: ${LLM_PROVIDER:-claude}

  # Optional cheaper/faster model used for routing, titles and summaries.
  # Leave blank to reuse the main model.
  router_provider: ${ROUTER_PROVIDER:-}

  claude:
    model_name: ${CLAUDE_MODEL:-claude-sonnet-5-5}
    router_model_name: ${CLAUDE_ROUTER_MODEL:-claude-haiku-5-5}
    api_key: ${ANTHROPIC_API_KEY}
    temperature: 0.3
    max_tokens: 4096

  openai:
    model_name: ${OPENAI_MODEL:-gpt-4.1-mini}
    api_key: ${OPENAI_API_KEY}
    temperature: 0.3

  openrouter:
    model_name: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    temperature: 0.3

  # Ollama (was "local2" in the previous config; that name still works)
  ollama:
    model_name: ${OLLAMA_MODEL:-qwen3:4b}
    base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    temperature: 0.3
    reasoning: false   # hide <think> blocks from qwen3/deepseek-r1 style models

  # Any OpenAI-compatible server (vLLM, LM Studio, llama.cpp server)
  local:
    model_name: ${LOCAL_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
    base_url: ${LOCAL_BASE_URL:-http://localhost:8000/v1}
    api_key: ${LOCAL_API_KEY:-not-needed}
    temperature: 0.3

  request_timeout_seconds: 120
  max_retries: 2

embeddings:
  # ollama | openai | fake ("fake" is deterministic and only for tests/demo)
  provider: ${EMBEDDING_PROVIDER:-ollama}
  ollama:
    # 0.6b: 639 MB, 1024-dim vectors. Changing the model later means re-adding your documents.
    model: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
    base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    # Start `ollama serve` when a local Ollama isn't running (development only).
    autostart: ${OLLAMA_AUTOSTART:-true}
  openai:
    model: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
    api_key: ${OPENAI_API_KEY}

rag:
  collection: chatbot_docs
  k: 6                 # passages sent to the model
  fetch_k: 24          # candidates considered by MMR
  lambda_mult: 0.6     # MMR diversity (0 = diverse, 1 = similar)
  rerank: false        # cross-encoder rerank; needs `pip install sentence-transformers`
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  chunk_size: 1000
  chunk_overlap: 150

agent:
  # auto = Tavily when TAVILY_API_KEY is set, else DuckDuckGo (no key needed);
  # Tavily failures also fall back to DuckDuckGo. Or: tavily | duckduckgo | off
  web_search: ${WEB_SEARCH_PROVIDER:-auto}
  max_iterations: 8
  tool_timeout_seconds: 45
  max_tool_output_chars: 12000
  web_results: 5

approvals:
  # Before the agent runs an action (send, create, delete, write, or a task for OpenClaw/Hermes),
  # it pauses and the chat shows an approval card. Look-ups never ask.
  # ask = pause for approval (default) | off = run everything without asking.
  # Per-tool choices (Always allow / Ask first / Off) are made in the Connections panel.
  mode: ${TOOL_APPROVALS:-ask}

research:
  # Deep research: plan sub-questions, search them in parallel, check for gaps,
  # then write a cited report. Quick look-ups ("weather in Pune", "who won…")
  # skip the plan and use the tool agent directly.
  max_sub_questions: 4    # sub-questions in the first round
  max_rounds: 2           # 1 = no follow-up round after the gap check
  results_per_query: 5    # web results kept per sub-question
  note_chars: 1200        # characters kept from each result
  # Sources given to the report writer (balanced across sub-questions) and their total text.
  # Small/free models return an empty report when this is too long (the writer then retries
  # with half); raise both for large-context models.
  max_report_sources: 12
  source_budget_chars: 9000

memory:
  # Short-term memory: the conversation in this thread (LangGraph checkpointer).
  context_tokens: 3000          # most recent messages sent to the model each turn, by token count
  summary_trigger_tokens: 6000  # summarise older messages once the thread holds more than this
  summary_threshold: 24         # ...or more messages than this
  keep_last_messages: 6         # messages kept verbatim after summarising
  context_messages: 12          # upper bound on messages sent, whatever their size

  # Long-term memory: facts about the user, kept across conversations in the
  # LangGraph store (Postgres when DB_URI is reachable, in-memory otherwise).
  long_term: ${LONG_TERM_MEMORY:-on}   # on | off
  user_id: ${MEMORY_USER_ID:-local}    # one person per server unless clients send their own id
  max_memories: 200                    # oldest are dropped past this
  recall_limit: 40                     # memories put in the prompt each turn
