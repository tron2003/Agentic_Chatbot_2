# Local production-like stack: Postgres with pgvector + the app (API and UI on :8001).
#
#   cp .env.example .env        # add ANTHROPIC_API_KEY etc.
#   docker compose up -d --build
#   open http://localhost:8001
#
# Using Ollama:
#   - Ollama on your machine (Windows/macOS): set OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env
#   - Ollama in a container:  docker compose --profile ollama up -d
#     and set OLLAMA_BASE_URL=http://ollama:11434 in .env

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      DB_URI: postgresql://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-chatbot}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8001}
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workspace:/app/workspace
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  workspace:
  ollama:
