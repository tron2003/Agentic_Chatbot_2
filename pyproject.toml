[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_chatbot"
version = "2.1.0"
description = "Agentic chatbot: LangGraph router over chat, document Q&A (RAG) and a tool-using research agent."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
    "langchain-postgres>=0.0.15",
    "langchain-tavily>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.20",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "xlrd>=2.0",
    "pandas>=2.2",
    "duckdb>=1.1",
    "fpdf2>=2.8",
    "markdown>=3.6",
    "ddgs>=9.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "B904", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_chatbot", "tests"]
