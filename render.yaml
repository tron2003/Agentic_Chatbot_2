# Render Blueprint: one Docker web service (API + UI) and a managed Postgres.
# New > Blueprint in the Render dashboard, point it at this repo, and fill in the
# secrets it asks for. Render Postgres supports the pgvector extension, which the
# app enables on first start.
#
# Ollama isn't available on Render, so embeddings default to OpenAI here.

services:
  - type: web
    name: junction
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_URI
        fromDatabase:
          name: junction-db
          property: connectionString
      - key: LLM_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: API_KEYS
        sync: false
      - key: ENABLE_MCP
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: junction-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
